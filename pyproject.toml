[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch-lite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.135,<1", "pydantic>=2.12,<3", "uvicorn>=0.41,<1", "opentelemetry-api>=1.40,<2", "opentelemetry-sdk>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "mypy>=1.19,<2", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
